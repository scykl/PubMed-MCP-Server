services:
  pubmed-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: pubmed-mcp:latest
    container_name: pubmed-mcp
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8090
    volumes:
      - ./downloads:/app/downloads
